<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repline</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23050605'/%3E%3Cpath d='M32 9.5l19.5 11.25v22.5L32 54.5 12.5 43.25v-22.5z' fill='none' stroke='%2339FF14' stroke-width='4.5' stroke-linejoin='round'/%3E%3Cpath d='M22.5 37.5L32 28l9.5 9.5' fill='none' stroke='%2339FF14' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#050605">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Repline">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Repline: a simple gym log with progress charts, how-to pictures and smart targets.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style id="app-style">
/* Layout: one narrow column built for a phone in the gym; summary strip, tabs, then the working view. */
:root{
  --bg:#f2f4f1; --surface:#ffffff; --glass:rgba(255,255,255,.72); --glass-line:rgba(10,12,10,.08);
  --ink:#0b0d0b; --muted:#5c665c; --line:#dde2dc;
  --accent:#39ff14; --accent-ink:#050605; --accent-text:#0e7a3a; --accent-soft:#e2f8da;
  --good:#138a3e; --warn:#b26a00; --bad:#d0342c;
  --shadow:0 8px 30px rgba(0,0,0,.10);
  --ease:cubic-bezier(.32,.72,0,1);
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-mode="light"]){
    --bg:#050605; --surface:#111311; --glass:rgba(20,23,20,.62); --glass-line:rgba(255,255,255,.08);
    --ink:#f2f5f0; --muted:#8e978c; --line:#232822;
    --accent:#39ff14; --accent-ink:#050605; --accent-text:#39ff14; --accent-soft:rgba(57,255,20,.13);
    --good:#5ee08a; --warn:#ffb020; --bad:#ff5c5c; --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-mode="light"]), :root[data-mode="dark"]{
  --bg:#050605; --surface:#111311; --glass:rgba(20,23,20,.62); --glass-line:rgba(255,255,255,.08);
  --ink:#f2f5f0; --muted:#8e978c; --line:#232822;
  --accent:#39ff14; --accent-ink:#050605; --accent-text:#39ff14; --accent-soft:rgba(57,255,20,.13);
  --good:#5ee08a; --warn:#ffb020; --bad:#ff5c5c; --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45}
body{padding:0 16px 120px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.page{display:flex;flex-direction:column;gap:14px;view-transition-name:page}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.05}
h2{font-size:22px}
h3{font-size:18px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.status{font-size:13px;color:var(--muted)}
.status.ok::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:6px}
.status.off::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:6px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-family:var(--font-display);font-size:24px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .s{font-size:12px;color:var(--muted)}
.tile.next{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.next .k,.tile.next .s{color:var(--accent-ink);opacity:.85}
header.bar{position:sticky;top:0;z-index:8;margin:0 -16px;padding:12px 16px 10px;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border-bottom:1px solid var(--glass-line);display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px;flex:none;border-radius:9px}
.brand .wm{font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:.06em;line-height:1}
.brand .wm span{color:var(--accent-text)}
.brand .sp{flex:1}
.modebtn{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;font-size:13px;background:var(--glass);border:1px solid var(--glass-line)}
.modebtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
nav.tabs{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(560px,calc(100% - 24px));z-index:9;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px;border-radius:26px;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);border:1px solid var(--glass-line);box-shadow:var(--shadow);view-transition-name:tabbar}
nav.tabs a{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;border-radius:20px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:600;transition:color .25s var(--ease),transform .2s var(--ease)}
nav.tabs a svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;position:relative;z-index:1}
nav.tabs a span{position:relative;z-index:1}
nav.tabs a.on{color:var(--ink)}
nav.tabs a:active{transform:scale(.94)}
nav.tabs .pill{position:absolute;inset:0;border-radius:20px;background:var(--accent-soft);view-transition-name:tabpill}
nav.tabs a.on svg{color:var(--accent-text)}
::view-transition-group(*){animation-duration:.42s;animation-timing-function:var(--ease)}
::view-transition-old(page){animation:vt-out .32s var(--ease) both}
::view-transition-new(page){animation:vt-in .42s var(--ease) both}
html[data-dir="back"]::view-transition-old(page){animation-name:vt-out-back}
html[data-dir="back"]::view-transition-new(page){animation-name:vt-in-back}
@keyframes vt-out{to{opacity:0;transform:translateX(-12%) scale(.98);filter:blur(4px)}}
@keyframes vt-in{from{opacity:0;transform:translateX(18%)}}
@keyframes vt-out-back{to{opacity:0;transform:translateX(12%) scale(.98);filter:blur(4px)}}
@keyframes vt-in-back{from{opacity:0;transform:translateX(-18%)}}
.page.enter{animation:vt-in .42s var(--ease) both}
.page.enter-back{animation:vt-in-back .42s var(--ease) both}
.card{scroll-margin-top:90px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > *{min-width:0}
.grow{flex:1 1 0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1 1 120px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent-text);outline-offset:1px}
button{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent}
button.danger{color:var(--bad)}
button.tiny{padding:4px 9px;font-size:14px}
button:disabled{opacity:.5;cursor:default}
.ex-head{display:flex;gap:8px;align-items:center}
.ex-head select{font-family:var(--font-display);font-size:19px;font-weight:600;padding:6px 8px}
.advice{font-size:14px;color:var(--muted);border-left:3px solid var(--accent-text);padding:2px 0 2px 10px}
.sets{display:grid;grid-template-columns:52px 1fr 1fr 34px;gap:6px;align-items:center}
.sets .h{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sets .n{font-family:var(--font-display);font-weight:600;color:var(--muted)}
.sets input{text-align:center;font-family:var(--font-display);font-size:19px;font-variant-numeric:tabular-nums;padding:7px 4px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.list{display:flex;flex-direction:column;gap:8px}
.sess{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.sess .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.sess ul{margin:0;padding-left:18px;font-size:14px}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
td.num,th.num{text-align:right}
.tablewrap{overflow-x:auto}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;background:var(--accent-text)}
.legend i.avg{background:var(--muted)}
.review{white-space:pre-wrap;font-size:15px;background:var(--bg);border-radius:8px;padding:10px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);z-index:20}
.toast.err{background:var(--bad);color:#fff}
.busy{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);display:flex;align-items:center;justify-content:center;z-index:30;font-family:var(--font-display);font-size:22px}
.strip{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted)}
.strip strong{color:var(--ink);font-weight:600}
.step{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.step b{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);align-items:center;justify-content:center;font-size:14px}
.datebig{font-family:var(--font-display);font-size:22px;font-weight:600;padding:8px 10px}
.splitbar{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.splitbar button span:not(.nx){font-size:15px;white-space:nowrap}
.plans{display:flex;flex-direction:column;gap:6px}
.chip.plan{min-width:150px;border-color:var(--glass-line)}
.chip.plan.armed{border-color:var(--warn)}
.chk.part{border-color:var(--accent-text);color:var(--accent-text);font-size:10px;font-weight:700;width:auto;min-width:22px;padding:0 5px;border-radius:11px}
.splitbar button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border-radius:10px;font-family:var(--font-display);font-size:17px;font-weight:600;color:var(--muted);background:var(--bg)}
.splitbar button svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.splitbar button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.splitbar button.armed{border-color:var(--warn);color:var(--warn)}
.splitbar .nx{font-size:11px;font-family:var(--font-body);font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.8}
.daylist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:d}
.daylist li{counter-increment:d}
.daylist .mhead{width:100%;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;text-align:left;font-weight:500;background:var(--bg);padding:9px 10px}
.daylist .mhead::before{content:counter(d);font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--muted);text-align:center}
.daylist .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--accent-ink)}
.daylist .done .chk{background:var(--good);border-color:var(--good)}
.daylist .done .nm{color:var(--muted);text-decoration:line-through}
.daylist .lw{display:block;font-size:12px;color:var(--muted);font-weight:400}
.howto{align-self:flex-start}
.guide{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg)}
.guide .anim{display:flex;flex-direction:column;align-items:center;gap:4px}
.guide .anim .fig{max-width:280px}
.guide .phase{font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--accent-text)}
.guide .frames{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.guide figure{margin:0;display:flex;flex-direction:column;gap:4px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--surface)}
.guide figcaption{font-size:13px;text-align:center}
.guide figcaption b{display:inline-flex;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--accent-ink);align-items:center;justify-content:center;font-size:11px;margin-right:4px}
.guide .cues{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.fig{width:100%;height:auto;display:block}
.fig .limb{stroke:var(--ink);stroke-width:7;stroke-linecap:round}
.fig .headc{fill:var(--ink)}
.fig .eq{stroke:var(--muted);stroke-width:4;stroke-linecap:round;fill:var(--muted)}
.fig .eq-move{stroke:var(--accent-text);stroke-linecap:round;fill:var(--accent-text)}
.fig .limb2{stroke:var(--muted);stroke-width:6;stroke-linecap:round;opacity:.55}
.fig .eq-fill{fill:var(--line)}
.daylist li{border-radius:10px}
.daylist li.open{border:1px solid var(--accent-text);background:var(--surface)}
.daylist li.open .mhead{background:var(--accent-soft);border-color:transparent;border-radius:9px 9px 0 0}
.mbody{display:flex;flex-direction:column;gap:10px;padding:10px;transform-origin:top;animation:open .34s var(--ease) both}
@keyframes open{from{opacity:0;transform:translateY(-8px) scaleY(.96)}}
.guide{animation:open .3s var(--ease) both}
.toast{animation:toastin .35s var(--ease) both;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
@keyframes toastin{from{opacity:0;transform:translate(-50%,12px)}}
.mbody > .primary{width:100%;padding:12px}
.first{font-size:14px;background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.first ol{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
button{transition:transform .18s var(--ease),background-color .2s,color .2s,border-color .2s}
button:active{transform:scale(.96)}
button.dangerfill{background:var(--bad);border-color:var(--bad);color:#fff}
details.card > summary{cursor:pointer;list-style:none}
details.card > summary::-webkit-details-marker{display:none}
details.card > summary h3::after{content:" ▸";color:var(--muted)}
details.card[open] > summary h3::after{content:" ▾"}
.alts{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:7px 12px;border-radius:14px;font-size:14px;background:var(--bg)}
.chip small{font-weight:500;color:var(--muted);font-size:11px}
.who{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px 4px 4px;background:var(--glass);border:1px solid var(--glass-line);font-size:14px;max-width:46%}
.who .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;flex:none}
.av{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--font-display);font-weight:700;font-size:15px;flex:none}
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);animation:fade .25s var(--ease) both}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(640px,100%);z-index:21;max-height:88%;overflow:auto;padding:10px 18px 28px;border-radius:26px 26px 0 0;background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--glass-line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;animation:sheetup .42s var(--ease) both}
@keyframes sheetup{from{transform:translate(-50%,100%)}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--surface);text-align:left;font-weight:500}
.prow .av{width:38px;height:38px;font-size:20px}
.prow .pt{display:flex;flex-direction:column;flex:1;min-width:0}
.prow small{color:var(--muted);font-size:13px}
.prow.on{border-color:var(--accent-text)}
.prow .tick{color:var(--accent-text);font-weight:700}
.sheet.tall{height:86%}
.sheet > label.f{flex:0 0 auto}
.pklist{display:flex;flex-direction:column;gap:6px;overflow:auto;flex:1;min-height:0}
.pkgroup{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.pkrow{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:var(--surface);border-radius:14px;padding:9px 12px;font-weight:500}
.pkrow b{display:block;font-weight:600}
.pkrow small{color:var(--muted);font-size:12px}
.pkpic{font-size:11px;color:var(--accent-text);border:1px solid var(--accent-text);border-radius:999px;padding:1px 7px;flex:none}
.pknew{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px dashed var(--accent-text);background:var(--accent-soft);border-radius:14px;padding:10px 12px}
.pknew small{color:var(--muted);font-weight:500}
.target{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.target.fromreview{border-color:var(--accent-text);background:var(--accent-soft)}
.tt{display:flex;justify-content:space-between;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.tt .src{text-transform:none;letter-spacing:0;font-weight:500}
.target .tv{font-family:var(--font-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.target .tiny{align-self:flex-start}
.card.lesson{border-color:var(--accent-text);background:var(--accent-soft);gap:6px}
.tr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.savedrv{font-size:13px;color:var(--muted)}
.plan{display:flex;flex-direction:column;gap:6px}
.pday{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:8px 10px;border-radius:12px;background:var(--bg);border:1px solid transparent}
.pday.sug{border-color:var(--accent-text);background:var(--accent-soft)}
.pday.booked{border-color:var(--good)}
.pday.rest{opacity:.65}
.pd{font-family:var(--font-display);font-weight:700;font-size:17px}
.pb{display:flex;flex-direction:column;gap:4px;min-width:0}
.psug{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.psug b{font-family:var(--font-display);font-size:18px}
.pgym{color:var(--good);font-weight:600;font-size:14px}
.pev{display:flex;flex-wrap:wrap;gap:4px}
.pev span{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.plate{font-size:12px;color:var(--warn)}
.warm{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--bg)}
.warm summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;list-style:none;font-family:var(--font-display);font-weight:600;font-size:18px}
.warm summary::-webkit-details-marker{display:none}
.warm summary span:first-child::after{content:" ▸";color:var(--muted)}
.warm[open] summary span:first-child::after{content:" ▾"}
.witem{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.warm summary + .witem{margin-top:8px}
.witem input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--accent-text)}
.witem b{font-weight:600}
.witem small{display:block;color:var(--muted);font-size:13px}
.witem:has(input:checked) b{text-decoration:line-through;color:var(--muted)}
.wrow{display:flex;align-items:flex-start;gap:8px;border-top:1px solid var(--line)}
.wrow .witem{flex:1;border-top:none}
.wrow > button{margin-top:8px;flex:none}
.warm summary + .wrow{margin-top:8px}
.warm .guide{margin:4px 0 10px}
.plate .row{margin-top:6px}
.btnlink{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:14px;font-weight:600;background:var(--surface)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav.tabs a span{font-size:11px}
.filebtn{position:relative;display:inline-flex;align-items:center;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.banner{background:color-mix(in srgb,var(--warn) 16%,var(--surface));border:1px solid var(--warn);border-radius:10px;padding:10px 12px;font-size:14px}
@media (max-width:420px){ .modebtn span{display:none} .modebtn{padding:7px} .brand{gap:8px} .tile .v{font-size:20px} .tile{padding:9px 10px} }
.card > label.f, .card > .row > label.f{flex:0 0 auto}
.card > .row > label.f{flex:1 1 120px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

/* ---------- tablet & laptop ---------- */
@media (hover:hover){
  button:hover{border-color:var(--accent-text)}
  button.primary:hover{filter:brightness(1.06)}
  nav.tabs a:hover{color:var(--ink)}
  .pkrow:hover,.prow:hover,.mhead:hover{border-color:var(--accent-text)}
  .chip:hover{border-color:var(--accent-text)}
}
@media (min-width:760px){
  body{padding:0 28px 120px}
  .wrap{max-width:1080px}
  header.bar{margin:0 -28px;padding:14px 28px 12px}
  .page{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start;grid-auto-flow:row dense}
  .page > *{grid-column:1 / -1}
  .page > .span,.page > .banner{grid-column:1 / -1}
  .v-history .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
  .v-plan > .card:not(.span){grid-column:auto}
  .v-progress{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
  .v-progress > .main{grid-column:1}
  .v-progress > .side{grid-column:2}
  .v-body{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
  .v-body > .main{grid-column:1}
  .v-body > .side{grid-column:2}
  .tiles{gap:10px}
  .card.side .chips,.v-plan .chips{flex-wrap:wrap;overflow:visible}
  .tile .v{font-size:28px}
  .scrim{background:rgba(0,0,0,.45)}
  .sheet{top:50%;bottom:auto;transform:translate(-50%,-50%);width:min(560px,calc(100% - 48px));max-height:84vh;border-radius:26px;animation:dlgin .32s var(--ease) both}
  .sheet.tall{height:min(720px,84vh)}
  .sheet .grab{display:none}
  @keyframes dlgin{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}}
  .daylist .mhead{padding:11px 14px}
  .sets{grid-template-columns:64px minmax(0,1fr) minmax(0,1fr) 40px;max-width:560px}
  .guide{flex-direction:row;flex-wrap:wrap;align-items:flex-start}
  .guide .anim{flex:1 1 260px}
  .guide .frames{flex:1 1 260px}
  .guide .cues,.guide > .small{flex:1 1 100%}
}
@media (min-width:1024px){
  body{padding:0 32px 40px 132px}
  header.bar{margin:12px 0 0;top:12px;padding:12px 18px;border:1px solid var(--glass-line);border-radius:20px}
  .wrap{max-width:1180px}
  nav.tabs{left:20px;top:50%;bottom:auto;transform:translateY(-50%);width:88px;grid-template-columns:1fr;gap:4px;padding:8px;border-radius:24px}
  nav.tabs a{padding:12px 4px 10px;border-radius:18px}
  nav.tabs a span{font-size:12px}
  .v-log{grid-template-columns:minmax(0,1fr) 380px}
  .v-log > .main{grid-column:1}
  .v-log > .side{grid-column:2}
  .sticky{position:sticky;top:96px}
  .v-plan{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .toast{bottom:28px}
}
@media (min-width:1400px){
  .wrap{max-width:1320px}
  .v-history .list{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function fmt(n){ if (n==null || n==='' || isNaN(+n)) return '–'; return String(Math.round(+n*100)/100); }
function todayStr(){ var d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function niceDate(s){ if(!s) return ''; var d=new Date(s+'T00:00:00'); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function isNum(v){ return v!==null && v!=='' && v!==undefined && !isNaN(+v); }
function rangeTxt(ex){ var r=ex.range||[8,12]; return r[0]+'–'+r[1]; }
function sessionsSorted(){ return P().sessions.slice().sort(function(a,b){ return (a.date||'').localeCompare(b.date||'') || a.id.localeCompare(b.id); }); }

/* ---------- history & metrics ---------- */
var HC = null;
function historyFor(exId){
  if (HC && HC[exId]) return HC[exId];
  var ex = exById(exId), pts = [];
  if (!ex) return pts;
  ((P().legacy||{})[ex.id]||[]).forEach(function(row,i){
    var note = ((P().legacyNotes||{})[ex.id]||{})[String(i)];
    if (ex.kind==='distance') pts.push({label:'Old '+(i+1), legacy:true, dist:row});
    else pts.push({label:'Old '+(i+1), legacy:true, note:note, sets:row.map(function(w){ return {w:w, r:null}; })});
  });
  sessionsSorted().forEach(function(s){
    (s.entries||[]).forEach(function(e){
      if (e.ex!==exId) return;
      if (ex.kind==='distance') pts.push({label:s.date, date:s.date, sid:s.id, dist:e.dist});
      else pts.push({label:s.date, date:s.date, sid:s.id, sets:e.sets||[]});
    });
  });
  if (HC) HC[exId] = pts;
  return pts;
}
function metrics(ex, p){
  if (ex.kind==='distance') return {top:isNum(p.dist)?+p.dist:null, avg:null};
  var ws = (p.sets||[]).map(function(s){ return +s.w; }).filter(function(w){ return !isNaN(w); });
  if (!ws.length) return {top:null, avg:null};
  var top = ex.assisted ? Math.min.apply(null, ws) : Math.max.apply(null, ws);
  var avg = ws.reduce(function(a,b){ return a+b; },0)/ws.length;
  var allReps = p.sets.length>0 && p.sets.every(function(s){ return isNum(s.r); });
  var out = {top:top, avg:avg, reps:null, vol:null};
  if (allReps){
    out.reps = p.sets.map(function(s){ return +s.r; });
    if (!ex.assisted) out.vol = p.sets.reduce(function(a,s){ return a + (+s.w)*(+s.r); },0);
  }
  return out;
}
function setsText(ex, sets){
  return (sets||[]).map(function(s){ return fmt(s.w)+(isNum(s.r)?'×'+s.r:''); }).join(', ') + (ex.assisted?' kg assist':' kg');
}
function advice(exId){
  var ex = exById(exId); if (!ex) return '';
  var h = historyFor(exId);
  if (!h.length) return ex.kind==='distance' ? 'First time on this. Log the distance at 10 minutes.' : 'First time. Pick a weight you can do for '+rangeTxt(ex)+' clean reps.';
  var last = h[h.length-1];
  if (ex.kind==='distance'){
    var best = Math.max.apply(null, h.map(function(p){ return +p.dist||0; }));
    return 'Last ('+(last.legacy?last.label:niceDate(last.date))+'): '+fmt(last.dist)+' '+(ex.unit||'')+'. Best: '+fmt(best)+'.';
  }
  var hi = (ex.range||[8,12])[1];
  var reps = (last.sets||[]).filter(function(s){ return isNum(s.r); });
  var tip;
  if (reps.length < (last.sets||[]).length) tip = 'Reps weren’t logged. Use one working weight for all 3 sets and log reps today.';
  else if (reps.every(function(s){ return +s.r>=hi; })) tip = ex.assisted ? 'Every set hit '+hi+'. Lower the assistance one step.' : 'Every set hit '+hi+'. Go up one weight step.';
  else tip = 'Same weight. Aim for '+hi+' reps on every set.';
  return 'Last ('+(last.legacy?last.label:niceDate(last.date))+'): '+setsText(ex,last.sets)+'. '+tip;
}
function lastWeights(exId){
  var h = historyFor(exId); if (!h.length) return [];
  var last = h[h.length-1]; return (last.sets||[]).map(function(s){ return s.w; });
}
function trendPill(ex, h){
  var vals = h.map(function(p){ return metrics(ex,p).top; }).filter(function(v){ return v!=null; });
  if (vals.length<2) return '<span class="pill">New</span>';
  var a = vals[vals.length-2], b = vals[vals.length-1];
  var better = ex.assisted ? b<a : b>a, worse = ex.assisted ? b>a : b<a;
  if (better) return '<span class="pill good">Up vs last</span>';
  if (worse) return '<span class="pill bad">Down vs last</span>';
  return '<span class="pill warn">Same as last</span>';
}

/* ---------- split rotation ---------- */
function nextSplit(){
  var ss = sessionsSorted().filter(function(s){ return ORDER.indexOf(s.split)>=0; });
  if (!ss.length) return 'push';
  var i = ORDER.indexOf(ss[ss.length-1].split);
  return ORDER[(i+1)%ORDER.length];
}

/* ---------- draft (unsaved form) ---------- */
function blankEntry(id){
  var ex = exById(id);
  if (ex && ex.kind==='distance') return {ex:id, dist:''};
  return {ex:id, sets:[{w:'',r:''},{w:'',r:''},{w:'',r:''}]};
}
function newDraft(split){
  split = split || nextSplit();
  return {id:null, date:todayStr(), split:split, entries:tpl(split).map(blankEntry), notes:''};
}
function draftKey(){ var id = P().id; return id==='p1' ? 'gymTrackerDraft' : 'gymTrackerDraft_'+id; }
function loadDraft(){ try { var s = localStorage.getItem(draftKey()); return s ? JSON.parse(s) : null; } catch(e){ return null; } }
function saveDraft(){ try { localStorage.setItem(draftKey(), JSON.stringify(draft)); } catch(e){} }
function clearDraft(){ try { localStorage.removeItem(draftKey()); } catch(e){} }
var draft = loadDraft();
if (!draft || (!draft.id && !(draft.entries||[]).some(function(e){ return (e.sets||[]).some(function(s){ return s.w!==''||s.r!==''; }) || (e.dist!=null && e.dist!==''); }))) draft = newDraft();

/* ---------- saving ---------- */
function buildDoc(){
  var css = document.getElementById('app-style').textContent;
  var code = document.getElementById('app-code').textContent;
  var json = JSON.stringify(state).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>Repline</title>\n' + '<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 64 64\'%3E%3Crect width=\'64\' height=\'64\' rx=\'15\' fill=\'%23050605\'/%3E%3Cpath d=\'M32 9.5l19.5 11.25v22.5L32 54.5 12.5 43.25v-22.5z\' fill=\'none\' stroke=\'%2339FF14\' stroke-width=\'4.5\' stroke-linejoin=\'round\'/%3E%3Cpath d=\'M22.5 37.5L32 28l9.5 9.5\' fill=\'none\' stroke=\'%2339FF14\' stroke-width=\'6\' stroke-linecap=\'round\' stroke-linejoin=\'round\'/%3E%3C/svg%3E">\n' + '<meta name="theme-color" content="#050605">\n'
    + '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'
    + '<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">\n'
    + '<style id="app-style">' + css + '</style>\n</head>\n<body>\n<div class="wrap" id="app"><p class="muted">Loading your log…</p></div>\n'
    + '<script type="application/json" id="state">' + json + '<\/script>\n'
    + '<script id="app-code">' + code + '<\/script>\n</body>\n</html>\n';
}
function setBusy(on, msg){
  var b = $('#busy');
  if (on){ if (!b){ b=document.createElement('div'); b.id='busy'; b.className='busy'; document.body.appendChild(b); } b.textContent = msg||'Saving…'; }
  else if (b) b.remove();
}
var toastTimer = null;
function toast(msg, err){
  var t = $('#toast'); if (!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.className = 'toast'+(err?' err':''); t.textContent = msg; t.setAttribute('role','status');
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ if (t) t.remove(); }, err?6000:2600);
}
function commit(mutate, okMsg){
  if (STANDALONE){
    var snap0 = JSON.stringify(state);
    try { mutate(); localStorage.setItem(LS_KEY, JSON.stringify(state)); }
    catch(e){ state = JSON.parse(snap0); toast('Couldn’t save on this device ('+((e&&e.message)||'storage blocked')+'). Download a backup so nothing is lost.', true); render(); return Promise.resolve(false); }
    draft = loadDraft() || newDraft(); openEx = undefined; pendingDelete = null;
    toast(okMsg||'Saved'); render(); return Promise.resolve(true);
  }
  if (!artifactApi){ toast(capsChecked ? 'Saving only works on the tracker’s own page. Open it from the card in the chat.' : 'Still connecting. Try again in a moment.', true); return Promise.resolve(false); }
  var snap = JSON.stringify(state);
  mutate();
  setBusy(true);
  return artifactApi.publish(buildDoc()).then(function(){ setBusy(true, okMsg||'Saved'); return true; }, function(e){
    setBusy(false); state = JSON.parse(snap);
    var c = e && e.code;
    if (c==='conflict') toast('Another copy saved first. The page will reload with that version.', true);
    else if (c==='not_granted' || c==='not_writer') toast('This view is read-only, so nothing was saved.', true);
    else toast('Save failed: '+((e&&e.message)||c||'unknown error')+'. Your entries are still in the form.', true);
    render(); return false;
  });
}

/* starting-weight guess for first-time exercises: share of body weight for a beginner man,

var START_RATIO = {

  pushdown:0.18, ohext:0.1, skull:0.2, uprow:0.2, uprow1:0.06, bbshrug:0.5, dbshrug:0.2,
  latpull:0.4, latnarrow:0.4, latbar:0.4, midrow:0.35, seatedrow:0.35, lowrow:0.35, seatedlow:0.35, isorow:0.25, bbrow:0.3, dbrow:0.12, onearm:0.12, lawnmower:0.12, sapull:0.15,
  facepull:0.12, seatedfp:0.12, backfly:0.05, revfly:0.15, preacher:0.1, dbcurl:0.08, hammer:0.08, bbcurl:0.2, cablecurl:0.12,
  pullup:0.6, dip:0.5

function isLower(ex){ return MUSCLE_GROUP[ex.muscle]==='legs'; }
function sexMult(lower){ return P().sex==='f' ? (lower ? 0.7 : 0.55) : 1; }
function strengthFactor(lower){
  var lb = latestBody(); if (!lb) return 1;
  var fs = [];
  state.exercises.forEach(function(e){
    var r = START_RATIO[e.id]; if (!r || e.assisted || e.kind==='distance' || isLower(e)!==lower) return;
    var h = historyFor(e.id).filter(function(p){ return !p.legacy; }); if (!h.length) h = historyFor(e.id);
    if (!h.length) return;
    var top = metrics(e, h[h.length-1]).top; if (!top) return;

function startGuess(exId){

}

function entryProgress(en){
  if (en.sets==null) return {done: isNum(en.dist) ? 1 : 0, total:1};

}
function entryDone(en){

  var p = entryProgress(en); return p.total>0 && p.done===p.total;
}
function chkHTML(en){

var pendingDelete = null;
/* chart */
function lineChart(points, opts){
  opts = opts || {};
  var W=640, H=230, P={l:44, r:16, t:16, b:34};
  var ys = []; points.forEach(function(p){ if (p.y!=null) ys.push(p.y); if (p.y2!=null) ys.push(p.y2); });
  if (!ys.length) return '<p class="muted">No numbers logged yet.</p>';
  var min = Math.min.apply(null, ys), max = Math.max.apply(null, ys);
  if (min===max){ min -= 1; max += 1; }
  var pad = (max-min)*0.12; min = Math.max(0, min-pad); max = max+pad;
  var n = points.length, iw = W-P.l-P.r, ih = H-P.t-P.b;
  function x(i){ return P.l + (n===1 ? iw/2 : i*iw/(n-1)); }
  function y(v){ return P.t + ih*(1-(v-min)/(max-min)); }
  var g = '';
  var lastLegacy = -1; points.forEach(function(p,i){ if (p.legacy) lastLegacy = i; });
  if (lastLegacy>=0 && n>1){
    var edge = lastLegacy===n-1 ? W-P.r : (x(lastLegacy)+x(lastLegacy+1))/2;
    g += '<rect x="'+P.l+'" y="'+P.t+'" width="'+(edge-P.l)+'" height="'+ih+'" fill="var(--line)" opacity=".35"/>';
    g += '<text x="'+(P.l+6)+'" y="'+(P.t+14)+'" font-size="12" fill="var(--muted)">Older log (no dates, no reps)</text>';
  }
  for (var k=0;k<=3;k++){
    var v = min + (max-min)*k/3, yy = y(v);
    g += '<line x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)" stroke-width="1"/>';
    g += '<text x="'+(P.l-6)+'" y="'+(yy+4)+'" font-size="12" text-anchor="end" fill="var(--muted)">'+fmt(Math.round(v*10)/10)+'</text>';
  }
  function series(key, color, dash, width){
    var d='', started=false;
    points.forEach(function(p,i){ var v=p[key]; if (v==null){ started=false; return; } d += (started?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' '; started=true; });
    return d ? '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="'+width+'" stroke-linejoin="round" stroke-linecap="round"'+(dash?' stroke-dasharray="5 5"':'')+'/>' : '';
  }
  // area under main series
  var area = '', first=null, lastI=null;
  points.forEach(function(p,i){ if (p.y==null) return; if (first===null){ first=i; area='M'+x(i).toFixed(1)+' '+(P.t+ih)+' '; } area += 'L'+x(i).toFixed(1)+' '+y(p.y).toFixed(1)+' '; lastI=i; });
  if (first!==null){ area += 'L'+x(lastI).toFixed(1)+' '+(P.t+ih)+' Z'; g += '<path d="'+area+'" fill="var(--accent-text)" opacity=".12"/>'; }
  if (opts.y2) g += series('y2', 'var(--muted)', true, 2);
  g += series('y', 'var(--accent-text)', false, 2.5);
  points.forEach(function(p,i){ if (p.y==null) return; var isLast = i===lastI; g += '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.y).toFixed(1)+'" r="'+(isLast?5:3)+'" fill="'+(isLast?'var(--accent-text)':'var(--surface)')+'" stroke="var(--accent-text)" stroke-width="2"/>'; });
  if (lastI!==null){
    var lx = x(lastI), anchor = lx > W-60 ? 'end' : 'middle';
    g += '<text x="'+lx+'" y="'+(y(points[lastI].y)-10)+'" font-size="14" font-weight="700" text-anchor="'+anchor+'" fill="var(--ink)">'+fmt(points[lastI].y)+'</text>';
  }
  var labIdx = [0]; if (lastLegacy>=0 && lastLegacy<n-1) labIdx.push(lastLegacy+1); if (n>1) labIdx.push(n-1);
  labIdx.forEach(function(i, k){
    var p = points[i]; var lab = p.legacy ? p.label : niceDate(p.date);
    var anchor = i===0 ? 'start' : (i===n-1 ? 'end' : 'middle');
    if (k>0 && labIdx[k]===labIdx[k-1]) return;
    g += '<text x="'+x(i)+'" y="'+(H-10)+'" font-size="12" text-anchor="'+anchor+'" fill="var(--muted)">'+esc(lab)+'</text>';
  });
  return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.label||'Progress chart')+'">'+g+'</svg></div>';
}

var progressEx = null;

function sessionText(s){
  var lines = ['Session '+s.date+' — '+(SPLIT_LABEL[s.split]||s.split)];
  (s.entries||[]).forEach(function(e){
    var ex = exById(e.ex); if (!ex) return;
    var h = historyFor(e.ex); var idx = -1;
    for (var i=0;i<h.length;i++){ if (h[i].sid===s.id) { idx=i; break; } }
    var prev = idx>0 ? h.slice(Math.max(0, idx-2), idx) : [];
    var now = ex.kind==='distance' ? fmt(e.dist)+' '+(ex.unit||'') : setsText(ex, e.sets);
    lines.push('- '+ex.name+(ex.assisted?' (assisted: number is assistance, lower = stronger)':'')+' [target reps '+(ex.range?rangeTxt(ex):'-')+']: '+now);
    prev.forEach(function(p){ lines.push('    before ('+(p.legacy?p.label+', older log':p.date)+'): '+(ex.kind==='distance'?fmt(p.dist):setsText(ex,p.sets))); });
  });
  if (s.notes) lines.push('Notes: '+s.notes);
  var lb = latestBody(); if (lb) lines.push('Latest body weight: '+fmt(lb.kg)+' kg on '+lb.date+(isNum(lb.waist)?', waist '+fmt(lb.waist)+' cm':'')+(isNum(lb.fat)?', body fat '+fmt(lb.fat)+'%':''));
  return lines.join('\n');
}

var LEN = {torso:52, thigh:42, shin:40, foot:12, uarm:30, farm:28, head:16};
function vec(a, l){ var r = a*Math.PI/180; return [l*Math.cos(r), l*Math.sin(r)]; }

function sub(p, q){ return [p[0]-q[0], p[1]-q[1]]; }
function lerp(a, b, t){ return a + (b-a)*t; }

function C(p, r, cls){ return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+r+'" class="'+cls+'"/>'; }
function R(x, y, w, h){ return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="3" class="eq-fill"/>'; }
function perpLine(p, ang, len, off){ var c = add(p, vec(ang+90, off||0)); return L(add(c, vec(ang, -len/2)), add(c, vec(ang, len/2)), 'eq-move', 6); }
function joints(P){
  var J = {};
  if (P.root==='ankle'){ J.ankle = P.at; J.knee = sub(J.ankle, vec(P.shin, LEN.shin)); J.hip = sub(J.knee, vec(P.thigh, LEN.thigh)); J.shoulder = add(J.hip, vec(P.torso, LEN.torso)); }
  else if (P.root==='toe'){ J.toe = P.at; J.ankle = sub(J.toe, vec(P.foot, LEN.foot)); J.knee = sub(J.ankle, vec(P.shin, LEN.shin)); J.hip = sub(J.knee, vec(P.thigh, LEN.thigh)); J.shoulder = add(J.hip, vec(P.torso, LEN.torso)); }
  else if (P.root==='hand'){ J.hand = P.at; J.elbow = sub(J.hand, vec(P.farm, LEN.farm)); J.shoulder = sub(J.elbow, vec(P.uarm, LEN.uarm)); J.hip = sub(J.shoulder, vec(P.torso, LEN.torso)); }
  else { J.hip = P.at; J.shoulder = add(J.hip, vec(P.torso, LEN.torso)); }
  if (!J.knee){ J.knee = add(J.hip, vec(P.thigh, LEN.thigh)); J.ankle = add(J.knee, vec(P.shin, LEN.shin)); }
  if (!J.elbow){ J.elbow = add(J.shoulder, vec(P.uarm, LEN.uarm)); J.hand = add(J.elbow, vec(P.farm, LEN.farm)); }
  if (!J.toe) J.toe = add(J.ankle, vec(P.foot||0, LEN.foot));
  if (P.thigh2!=null){ J.knee2 = add(J.hip, vec(P.thigh2, LEN.thigh)); J.ankle2 = add(J.knee2, vec(P.shin2, LEN.shin)); J.toe2 = add(J.ankle2, vec(P.foot2||0, LEN.foot)); }
  J.head = add(J.shoulder, vec(P.torso, LEN.head));

}
var ANG_KEYS = ['torso','thigh','shin','foot','uarm','farm','thigh2','shin2','foot2'];
function poseAt(G, t){
  if (G.lerp==='xy'){
    var A = joints(G.start), B = joints(G.end), J = {};
    Object.keys(A).forEach(function(k){ J[k] = [lerp(A[k][0],B[k][0],t), lerp(A[k][1],B[k][1],t)]; });
    return J;
  }
  var P = {root:G.start.root, at:[lerp(G.start.at[0],G.end.at[0],t), lerp(G.start.at[1],G.end.at[1],t)]};
  ANG_KEYS.forEach(function(k){ if (G.start[k]!=null) P[k] = lerp(G.start[k], G.end[k], t); });

}

var openGuides = {}, animRAF = null, animT0 = 0;
function animate(now){
  var els = document.querySelectorAll('svg[data-anim]');
  if (!els.length){ animRAF = null; return; }
  if (!animT0) animT0 = now;
  var cyc = ((now - animT0)/1000) % 4, t, label;
  if (cyc < 0.6){ t = 0; label = 'start'; } else if (cyc < 1.8){ t = (1-Math.cos(Math.PI*(cyc-0.6)/1.2))/2; label = 'move'; }
  else if (cyc < 2.4){ t = 1; label = 'hold'; } else { t = (1+Math.cos(Math.PI*(cyc-2.4)/1.6))/2; label = 'back'; }
  els.forEach(function(el){
    var id = el.getAttribute('data-anim'), G = GUIDES[id]; el.innerHTML = figure(id, t);
    var ph = document.querySelector('[data-phase="'+id+'"]');
    if (ph && G) ph.textContent = label==='start' ? 'Start position' : label==='move' ? G.move+' (≈1 s)' : label==='hold' ? 'Squeeze' : G.back+' (2–3 s)';
  });
  animRAF = requestAnimationFrame(animate);
}

function searchEx(q){

  if (act==='pk-open'){ picker = {mode:t.getAttribute('data-mode'), i:i, q:''}; render(); return; }
  if (act==='pk-close'){ picker = null; render(); return; }
  if (act==='pk-choose'){ useExercise(t.getAttribute('data-ex')); picker = null; render(); revealOpen(); return; }
  if (act==='pk-new'){ var q0 = picker.q||''; picker.creating = true; picker.ai = ''; picker.form = {nick:q0, desc:'', name:'', muscle:'back', equip:'machine', like:''}; render(); return; }
  if (act==='pk-back'){ picker.creating = false; render(); return; }
  if (t.id==='cx-ask'){ askClaudeName(); return; }
  if (act==='cx-existing'){
    readCx(); var exId = t.getAttribute('data-ex'), nick = (picker.form.nick||'').trim(), exo = exById(exId);
    useExercise(exId); picker = null;
    if (nick && exo && nick.toLowerCase()!==exo.name.toLowerCase()){
      commit(function(){ exo.aliases = (exo.aliases||[]).concat([nick]); }, 'Added · “'+nick+'” saved as a nickname');
    } else render();
    return;
  }
  if (t.id==='cx-save'){
    readCx(); var f = picker.form, nm = (f.name||f.nick||'').trim();
    if (!nm){ toast('Give the exercise a name.', true); return; }
    var hi = ['quads','hamstrings','glutes','back','chest'].indexOf(f.muscle)>=0 ? [8,10] : [10,12];
    var nx = {id:'x'+Date.now(), name:nm, group:MUSCLE_GROUP[f.muscle]||'pull', kind:'weight', range:hi, muscle:f.muscle, equip:f.equip, like:f.like||null, aliases:(f.nick && f.nick.trim().toLowerCase()!==nm.toLowerCase()) ? [f.nick.trim()] : [], legacy:[]};
    if (picker.mode==='swap' && draft.entries[picker.i]) draft.entries[picker.i] = {ex:nx.id, sets:[{w:'',r:''},{w:'',r:''},{w:'',r:''}]};
    else { draft.entries.push({ex:nx.id, sets:[{w:'',r:''},{w:'',r:''},{w:'',r:''}]}); }
    saveDraft(); picker = null;
    commit(function(){ state.exercises.push(nx); }, nm+' added');
    return;
  }
  if (t.id==='who-btn'){ sheetOpen = true; render(); return; }
  if (act==='close-sheet'){ sheetOpen = false; render(); return; }
  if (act==='pick'){ var pid = t.getAttribute('data-id'); if (pid===P().id){ sheetOpen = false; render(); } else switchTo(pid); return; }
  if (t.id==='add-person'){
    var np = {id:'p'+Date.now(), name:'New person', sex:'m', height:null, goal:'', sessions:[], body:[], templates:{}, legacy:{}, legacyNotes:{}};
    try { localStorage.setItem('replineProfile', np.id); } catch(e){}
    commit(function(){ state.profiles.push(np); activeId = np.id; }, 'Person added');
    return;
  }
  if (t.id==='pf-save'){
    var nm = $('#pf-name').value.trim(), hh = $('#pf-h').value.replace(',', '.'), sx = $('#pf-sex').value, gl = $('#pf-goal').value.trim();
    if (!nm){ toast('Give this person a name.', true); return; }
    if (hh && !isNum(hh)){ toast('Height should be a number in cm, like 160.', true); return; }
    var me = P();
    commit(function(){ me.name = nm; me.height = hh ? +hh : null; me.sex = sx; me.goal = gl; }, 'Profile saved');
    return;
  }
  if (t.id==='mode-btn'){ var order=['auto','light','dark'], nm = order[(order.indexOf(getMode())+1)%3]; try { localStorage.setItem('replineMode', nm); } catch(e){} var go=function(){ applyMode(nm); render(); }; if (document.startViewTransition) document.startViewTransition(go); else go(); return; }
  if (act==='swap'){ var keep = draft.entries[i]; draft.entries[i] = blankEntry(t.getAttribute('data-ex')); if (keep && keep.notes) draft.entries[i].notes = keep.notes; saveDraft(); render(); return; }
  if (act==='guide'){ var gid = t.getAttribute('data-ex'); openGuides[gid] = !openGuides[gid]; render(); return; }
  if (act==='date'){ draft.date = t.getAttribute('data-v'); saveDraft(); render(); return; }
  if (act==='plan'){
    var pl = PLANS.filter(function(x){ return x.k===t.getAttribute('data-k'); })[0]; if (!pl) return;
    if (draft.entries.some(entryDone) && pendingPlan!==pl.k){ pendingPlan = pl.k; render(); toast('You have entries typed in. Tap the plan again to replace them.'); return; }
    pendingPlan = null;
    draft = {id:null, date:draft.date||todayStr(), split:pl.split, entries:pl.ex.filter(function(id){ return !!exById(id); }).map(blankEntry), notes:''};
    openEx = undefined; saveDraft(); render(); return;
  }
  if (act==='split'){
    var sp = t.getAttribute('data-split');
    if (sp===draft.split){ pendingSwitch = null; render(); return; }
    var hasData = draft.entries.some(entryDone);
    if (hasData && pendingSwitch!==sp){ pendingSwitch = sp; render(); toast('You have entries typed in. Tap '+SPLIT_LABEL[sp]+' again to switch and clear them.'); return; }
    pendingSwitch = null;
    draft = {id:null, date:draft.date||todayStr(), split:sp, entries:tpl(sp).map(blankEntry), notes:''};
    openEx = undefined; saveDraft(); render(); return;
  }
  if (act==='toggle'){ openEx = (openEx===i) ? null : i; render(); revealOpen(); return; }
  if (act==='next'){ draft.entries[i].done = true; saveDraft(); openEx = i+1; render(); revealOpen(); return; }
  if (act==='done1'){ draft.entries[i].done = true; saveDraft(); openEx = null; render(); return; }
  if (t.id==='save-template'){
    var ids = draft.entries.map(function(e){ return e.ex; }), spl = draft.split;
    commit(function(){ if (!P().templates) P().templates = {}; P().templates[spl] = ids; }, SPLIT_LABEL[spl]+' list saved');
    return;
  }
  if (act==='add-set'){ var ss = draft.entries[i].sets; var lastW = ss.length ? ss[ss.length-1].w : ''; ss.push({w:lastW, r:''}); saveDraft(); render(); return; }
  if (act==='rm-set'){ draft.entries[i].sets.splice(j,1); saveDraft(); render(); return; }
  if (act==='copy-set'){ var s0 = draft.entries[i].sets[0]; var w0 = s0.w!=='' ? s0.w : (lastWeights(draft.entries[i].ex)[0]||''); draft.entries[i].sets.forEach(function(s){ s.w = w0; }); saveDraft(); render(); return; }
  if (act==='rm-ex'){ draft.entries.splice(i,1); openEx = undefined; saveDraft(); render(); return; }
  if (act==='edit-s'){
    var s = P().sessions.filter(function(x){ return x.id===t.getAttribute('data-id'); })[0]; if (!s) return;
    draft = JSON.parse(JSON.stringify(s));
    draft.entries.forEach(function(e){ if (e.sets) e.sets.forEach(function(x){ x.w = x.w==null?'':String(x.w); x.r = x.r==null?'':String(x.r); }); if (e.dist!=null) e.dist = String(e.dist); });
    openEx = undefined; saveDraft(); if (currentView()!=='log') goTo('log'); else { render(); window.scrollTo(0,0); } return;
  }
  if (act==='del-s'){
    var id = t.getAttribute('data-id');
    if (pendingDelete!==id){ pendingDelete = id; render(); return; }
    pendingDelete = null;
    commit(function(){ P().sessions = P().sessions.filter(function(x){ return x.id!==id; }); }, 'Deleted');
    return;
  }
  if (act==='del-b'){
    var dt = t.getAttribute('data-date');
    if (pendingDelete!=='b'+dt){ pendingDelete = 'b'+dt; render(); return; }
    pendingDelete = null;
    commit(function(){ P().body = P().body.filter(function(x){ return x.date!==dt; }); }, 'Deleted');
    return;
  }
  if (t.id==='load-template'){ draft.entries = tpl(draft.split).map(blankEntry); openEx = undefined; saveDraft(); render(); return; }
  if (t.id==='clear-draft'){ draft = newDraft(); openEx = undefined; clearDraft(); render(); return; }
  if (t.id==='save-session'){
    var entries = [];
    draft.entries.forEach(function(e){
      var ex = exById(e.ex); if (!ex) return;
      if (ex.kind==='distance'){ if (isNum(e.dist)) entries.push({ex:e.ex, dist:+e.dist}); return; }
      var sets = (e.sets||[]).filter(function(s){ return isNum(s.w); }).map(function(s){ return {w:+s.w, r:isNum(s.r)?+s.r:null}; });
      if (sets.length) entries.push({ex:e.ex, sets:sets});
    });
    if (!entries.length){ toast('Fill in at least one weight before saving.', true); return; }
    if (!draft.date){ toast('Pick a date first.', true); return; }
    var sess = {id: draft.id || ('s'+Date.now()), date: draft.date, split: draft.split, entries: entries, notes: (draft.notes||'').trim()};
    var savedDraft = JSON.stringify(draft);
    clearDraft();
    commit(function(){
      var k = -1; P().sessions.forEach(function(x,n){ if (x.id===sess.id) k=n; });
      if (k>=0) P().sessions[k] = sess; else P().sessions.push(sess);
    }, 'Session saved').then(function(ok){ if (!ok){ try { localStorage.setItem(draftKey(), savedDraft); } catch(e){} } });
    return;
  }
  if (t.id==='b-save'){
    var kg = $('#b-kg').value.replace(',', '.'), date = $('#b-date').value;
    if (!isNum(kg) || !date){ toast('Enter a date and your weight in kg.', true); return; }
    var num = function(id){ var v = $(id).value.replace(',', '.'); return isNum(v) ? +v : null; };
    var entry = {date:date, kg:+kg, fat:num('#b-fat'), muscle:num('#b-muscle'), waist:num('#b-waist'), note:''};
    commit(function(){ P().body = P().body.filter(function(x){ return x.date!==date; }); P().body.push(entry); }, 'Weigh-in saved');
    return;
  }
  if (act==='rv'){ var rid = t.getAttribute('data-id'); reviewId = reviewId===rid ? null : rid; reviewText=''; render(); return; }
  if (act==='rv-copy'){ var s2 = P().sessions.filter(function(x){ return x.id===t.getAttribute('data-id'); })[0]; if (s2) copyText('Review my gym session:\n'+sessionText(s2), 'Copied. Paste it into the chat.'); return; }
  if (act==='rv-ask'){
    var s3 = P().sessions.filter(function(x){ return x.id===t.getAttribute('data-id'); })[0]; if (!s3 || !sampleApi || reviewBusy) return;
    reviewBusy = true; reviewText = ''; render();
    var pr = P(), lbx = latestBody();
    var exList = (s3.entries||[]).map(function(e){ var ex = exById(e.ex); return ex ? e.ex+' = '+ex.name+(ex.assisted?' (assisted: lower is stronger)':'')+' [reps '+(ex.range?rangeTxt(ex):'-')+']' : ''; }).join('; ');
    var prompt = 'You are a strength coach reviewing one gym session. Lifter: '+(pr.sex==='f'?'woman':'man')+(pr.height?', '+pr.height+' cm':'')+(lbx?', about '+fmt(lbx.kg)+' kg':'')+(pr.goal?'. Goal: '+pr.goal:'')+'. '
      + 'Program: 1 warm-up plus 3 working sets at one weight, double progression (add weight only when every set hits the top of the rep range). For assisted machines the number is assistance, so lower means stronger. Older-log entries have no reps.\n'
      + 'Exercise ids in this session: '+exList+'\n\n'+sessionText(s3)+'\n\n'
      + 'Reply with JSON only: {"review": plain text under 140 words with three short parts "Better:", "Stalled or dropped:", "Next time:"; '
      + '"targets": [{"ex_id": id from the list, "weight": number in kg for all 3 working sets, "reps": [3 numbers], "note": one short cue}] one per exercise; '
      + '"lesson": one short sentence about the whole session (rest, sleep, logging, order) for the very next workout, or "" if none}';
    var finish = function(v){
      reviewBusy = false;
      if (!v || typeof v!=='object' || !v.review){ reviewText = ''; render(); toast('Claude’s answer didn’t come through. Try again, or Copy it into the chat.', true); return; }
      var stamp = {from:s3.id, date:s3.date};
      commit(function(){
        var me = P(); if (!me.targets) me.targets = {};
        (v.targets||[]).forEach(function(tg){ if (exById(tg.ex_id) && isNum(tg.weight)) me.targets[tg.ex_id] = {w:+tg.weight, reps:(tg.reps||[]).slice(0,4).map(Number), note:String(tg.note||'').slice(0,140), from:stamp.from, date:stamp.date}; });
        if (v.lesson) me.lesson = {text:String(v.lesson).slice(0,200), from:stamp.from, date:stamp.date};
        s3.review = {text:String(v.review), at:todayStr()};
      }, 'Review saved · targets set for next time');
    };
    var call = sampleApi.json ? sampleApi.json(prompt) : sampleApi(prompt).then(function(r){ var m = (r.text||'').match(/\{[\s\S]*\}/); return m ? JSON.parse(m[0]) : null; });
    Promise.resolve(call).then(finish, function(e){ reviewBusy = false; render(); toast(e && e.code==='rate_limited' ? 'Claude is busy. Try again in a minute.' : 'Couldn’t get a review. Use Copy and paste it into the chat instead.', true); });
    return;
  }
  if (t.id==='n-save'){
    var name = $('#n-name').value.trim(); if (!name){ toast('Give the machine a name.', true); return; }
    var grp = $('#n-group').value, lo = +$('#n-lo').value||8, hi = +$('#n-hi').value||10;
    var exNew = {id:'x'+Date.now(), name:name, group:grp, kind: grp==='cardio'?'distance':'weight', legacy:[]};
    if (grp==='cardio') exNew.unit='m'; else { exNew.range=[lo,hi]; if ($('#n-assist').value==='1') exNew.assisted=true; }
    commit(function(){ state.exercises.push(exNew); }, 'Machine added');
    return;
  }
  if (t.id==='bk-copy'){ copyText(JSON.stringify(state), 'Backup copied'); return; }
  if (t.id==='bk-restore'){
    var txt = $('#bk-in').value.trim(); var parsed;
    try { parsed = JSON.parse(txt); } catch(e){ toast('That isn’t a valid backup. Paste the full text from “Copy full backup”.', true); return; }
    if (!parsed || !Array.isArray(parsed.exercises) || !(Array.isArray(parsed.sessions) || Array.isArray(parsed.profiles))){ toast('That backup is missing exercises or sessions.', true); return; }
    commit(function(){ state = migrate(parsed); }, 'Backup restored');
    return;
  }
});
var suppressHash = false;
function goTo(view){
  if (view===currentView()){ window.scrollTo({top:0, behavior:'smooth'}); return; }
  var dir = VIEWS.indexOf(view) < VIEWS.indexOf(currentView()) ? 'back' : 'fwd';
  document.documentElement.setAttribute('data-dir', dir);
  pendingDelete = null; pendingSwitch = null;
  var run = function(){ suppressHash = true; location.hash = view; render(); window.scrollTo(0,0); if (view==='plan') loadCalendar(false); };
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (document.startViewTransition && !reduce){ document.startViewTransition(run); }
  else { run(); if (!reduce){ var pg = document.querySelector('.page'); if (pg) pg.classList.add(dir==='back'?'enter-back':'enter'); } }
}
document.addEventListener('click', function(ev){
  var a = ev.target.closest('nav.tabs a'); if (!a) return;
  ev.preventDefault(); goTo(a.getAttribute('data-view'));
}, true);
window.addEventListener('hashchange', function(){ if (suppressHash){ suppressHash = false; return; } pendingDelete = null; pendingSwitch = null; render(); window.scrollTo(0,0); });

render();
if (STANDALONE && 'serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
if (window.claude && typeof window.claude.use==='function'){
  window.claude.use('artifact').then(function(a){ artifactApi = a; capsChecked = true; if (!document.activeElement || !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) render(); }, function(){ capsChecked = true; render(); });
  window.claude.use('sample').then(function(s){ sampleApi = s; if (currentView()==='history') render(); }, function(){});
  window.claude.use('mcp').then(function(m){ mcpApi = m; if (m && currentView()==='plan'){ render(); loadCalendar(false); } }, function(){});
} else { capsChecked = true; render(); }
})();
</script>
</body>
</html>
